{% extends 'base.html' %}

{% block title %}User Profile | AI Healthcare{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white p-4">
                    <h3 class="mb-0"><i class="fas fa-user-circle me-2"></i>My Profile</h3>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        {% csrf_token %}
                        
                        <h5 class="mb-3 border-bottom pb-2">Basic Details</h5>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" name="first_name" value="{{ user.first_name }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" name="last_name" value="{{ user.last_name }}">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Age</label>
                                <input type="number" class="form-control" name="age" value="{{ profile.age|default:'' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Gender</label>
                                <select class="form-select" name="gender">
                                    <option value="" {% if not profile.gender %}selected{% endif %}>Select...</option>
                                    <option value="Male" {% if profile.gender == 'Male' %}selected{% endif %}>Male</option>
                                    <option value="Female" {% if profile.gender == 'Female' %}selected{% endif %}>Female</option>
                                    <option value="Other" {% if profile.gender == 'Other' %}selected{% endif %}>Other</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Blood Group</label>
                                <input type="text" class="form-control" name="blood_group" value="{{ profile.blood_group|default:'' }}">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Height (cm)</label>
                                <input type="number" step="0.1" class="form-control" name="height" value="{{ profile.height|default:'' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Weight (kg)</label>
                                <input type="number" step="0.1" class="form-control" name="weight" value="{{ profile.weight|default:'' }}">
                            </div>
                        </div>

                        <h5 class="mb-3 border-bottom pb-2">Medical History</h5>
                        <div class="mb-3">
                            <label class="form-label">Past Medical History (Diseases/Surgeries)</label>
                            <textarea class="form-control" name="medical_history" rows="3">{{ profile.medical_history|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Allergies</label>
                            <textarea class="form-control" name="allergies" rows="2">{{ profile.allergies|default:'' }}</textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Current Medications</label>
                            <textarea class="form-control" name="current_medications" rows="2">{{ profile.current_medications|default:'' }}</textarea>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Save Profile</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
